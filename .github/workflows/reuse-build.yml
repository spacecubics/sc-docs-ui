name: Build Space Cubics UI (reusable)

on:
  workflow_call:

jobs:
  build-reusable:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Build Space Cubics UI bundle
        run: nix develop --command pnpm run build

      - name: Package full-document extension
        run: nix develop --command pnpm run bundle:mega

      - name: Upload UI bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: ui-bundle
          path: |
            build/ui-bundle.zip
            build/sc-docs-mega.tgz
          if-no-files-found: error
